[package]
name = "linux_monitor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "toprs"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
nix = { version = "0.29", features = ["fs"] }
ratatui = "0.29"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
